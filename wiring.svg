<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#222">LD2410B to ESP32-S3 wiring</text>
  <text x="40" y="60" font-size="12" fill="#555">Sensor TX and RX cross over to the ESP32 RX and TX pins.</text>

  <!-- ===== LD2410B module (long blue board, pads on right edge) ===== -->
  <rect x="40" y="155" width="270" height="72" rx="4" fill="#1f5fbf" stroke="#143f82" stroke-width="2"/>
  <text x="50" y="169" font-size="12" font-weight="bold" fill="#ffffff">HLK-LD2410B</text>
  <!-- end patches and feed -->
  <rect x="48" y="175" width="36" height="32" rx="2" fill="#d9a441" stroke="#a97a22"/>
  <rect x="218" y="175" width="32" height="32" rx="2" fill="#d9a441" stroke="#a97a22"/>
  <line x1="84" y1="191" x2="92" y2="191" stroke="#d9a441" stroke-width="3"/>
  <!-- QFN chip -->
  <rect x="92" y="178" width="26" height="26" rx="2" fill="#1a1a1a" stroke="#555"/>
  <circle cx="98" cy="184" r="2" fill="#888"/>
  <!-- meander antenna trace -->
  <polyline fill="none" stroke="#d9a441" stroke-width="3" stroke-linejoin="round"
    points="118,191 124,191 124,173 134,173 134,209 144,209 144,173 154,173 154,209 164,209 164,173 174,173 174,209 184,209 184,173 194,173 194,209 204,209 204,191 218,191"/>
  <!-- SMD parts and LED -->
  <rect x="94" y="211" width="8" height="5" fill="#b08a4a"/>
  <rect x="158" y="216" width="8" height="6" fill="#222"/>
  <rect x="170" y="216" width="6" height="6" fill="#43a047" stroke="#222" stroke-width="0.5"/>
  <!-- tan capacitor next to VCC and GND -->
  <rect x="256" y="160" width="8" height="24" rx="1" fill="#c9a66b" stroke="#8a6f3e"/>
  <!-- 5 round pads on the right edge -->
  <circle cx="298" cy="165" r="4" fill="#e6c14e" stroke="#8a6f3e"/>
  <circle cx="298" cy="179" r="4" fill="#e6c14e" stroke="#8a6f3e"/>
  <circle cx="298" cy="193" r="4" fill="#e6c14e" stroke="#8a6f3e"/>
  <circle cx="298" cy="207" r="4" fill="#e6c14e" stroke="#8a6f3e"/>
  <circle cx="298" cy="221" r="4" fill="#e6c14e" stroke="#8a6f3e"/>
  <g font-size="8" font-weight="bold" fill="#ffffff" text-anchor="end">
    <text x="289" y="168">VCC</text>
    <text x="289" y="182">GND</text>
    <text x="289" y="196">RX</text>
    <text x="289" y="210">TX</text>
    <text x="289" y="224">OUT</text>
  </g>
  <text x="318" y="224" font-size="9" fill="#777">not connected</text>

  <!-- ===== ESP32-S3 DevKitC-1 style board ===== -->
  <rect x="520" y="10" width="250" height="500" rx="8" fill="#0b1a3a" stroke="#050b1c" stroke-width="2"/>
  <!-- meander antenna -->
  <polyline fill="none" stroke="#d9a441" stroke-width="3" stroke-linejoin="round"
    points="575,64 575,30 589,30 589,64 603,64 603,30 617,30 617,64 631,64 631,30 645,30 645,64 659,64 659,30 673,30 673,64 687,64 687,30 701,30 701,64 715,64 715,30 729,30 729,64"/>
  <!-- module -->
  <rect x="565" y="75" width="170" height="125" rx="3" fill="#c8ccd2" stroke="#8d939b" stroke-width="2"/>
  <text x="650" y="132" font-size="12" font-weight="bold" fill="#444" text-anchor="middle">ESP32-S3-WROOM-1</text>
  <text x="650" y="148" font-size="9" fill="#666" text-anchor="middle">metal shield</text>
  <text x="650" y="190" font-size="8" fill="#666" text-anchor="middle">antenna end</text>

  <!-- left header pads, 22 pins, pitch 11 -->
  <g fill="#e6c14e">
    <rect x="529" y="212" width="6" height="6"/><rect x="529" y="223" width="6" height="6"/>
    <rect x="529" y="234" width="6" height="6"/><rect x="529" y="245" width="6" height="6"/>
    <rect x="529" y="256" width="6" height="6"/><rect x="529" y="267" width="6" height="6"/>
    <rect x="529" y="278" width="6" height="6"/><rect x="529" y="289" width="6" height="6"/>
    <rect x="529" y="300" width="6" height="6"/><rect x="529" y="311" width="6" height="6"/>
    <rect x="529" y="322" width="6" height="6"/><rect x="529" y="333" width="6" height="6"/>
    <rect x="529" y="344" width="6" height="6"/><rect x="529" y="355" width="6" height="6"/>
    <rect x="529" y="366" width="6" height="6"/><rect x="529" y="377" width="6" height="6"/>
    <rect x="529" y="388" width="6" height="6"/><rect x="529" y="399" width="6" height="6"/>
    <rect x="529" y="410" width="6" height="6"/><rect x="529" y="421" width="6" height="6"/>
    <rect x="529" y="432" width="6" height="6"/><rect x="529" y="443" width="6" height="6"/>
  </g>
  <!-- right header pads -->
  <g fill="#e6c14e">
    <rect x="755" y="212" width="6" height="6"/><rect x="755" y="223" width="6" height="6"/>
    <rect x="755" y="234" width="6" height="6"/><rect x="755" y="245" width="6" height="6"/>
    <rect x="755" y="256" width="6" height="6"/><rect x="755" y="267" width="6" height="6"/>
    <rect x="755" y="278" width="6" height="6"/><rect x="755" y="289" width="6" height="6"/>
    <rect x="755" y="300" width="6" height="6"/><rect x="755" y="311" width="6" height="6"/>
    <rect x="755" y="322" width="6" height="6"/><rect x="755" y="333" width="6" height="6"/>
    <rect x="755" y="344" width="6" height="6"/><rect x="755" y="355" width="6" height="6"/>
    <rect x="755" y="366" width="6" height="6"/><rect x="755" y="377" width="6" height="6"/>
    <rect x="755" y="388" width="6" height="6"/><rect x="755" y="399" width="6" height="6"/>
    <rect x="755" y="410" width="6" height="6"/><rect x="755" y="421" width="6" height="6"/>
    <rect x="755" y="432" width="6" height="6"/><rect x="755" y="443" width="6" height="6"/>
  </g>
  <!-- left pin labels -->
  <g font-size="8" fill="#cfd8ee">
    <text x="541" y="218">3V3</text>
    <text x="541" y="317" font-weight="bold" fill="#ffffff">GPIO17 (TX)</text>
    <text x="541" y="328" font-weight="bold" fill="#ffffff">GPIO18 (RX)</text>
    <text x="541" y="295">GPIO16</text>
    <text x="541" y="339">GPIO8</text>
    <text x="541" y="438" font-weight="bold" fill="#ffffff">5V</text>
    <text x="541" y="449" font-weight="bold" fill="#ffffff">GND</text>
    <text x="541" y="427">GPIO14</text>
  </g>
  <!-- right pin labels -->
  <g font-size="8" fill="#cfd8ee" text-anchor="end">
    <text x="749" y="218">GND</text>
    <text x="749" y="229">TX</text>
    <text x="749" y="240">RX</text>
    <text x="749" y="427">GPIO20</text>
    <text x="749" y="416">GPIO19</text>
    <text x="749" y="449">GND</text>
  </g>
  <!-- USB-UART chip, LED, buttons, SMD -->
  <rect x="630" y="395" width="60" height="26" rx="2" fill="#111" stroke="#444"/>
  <text x="660" y="411" font-size="8" fill="#ccc" text-anchor="middle">USB-UART</text>
  <rect x="705" y="436" width="14" height="14" fill="#e8e8e8" stroke="#999"/>
  <circle cx="709" cy="440" r="2" fill="#e53935"/><circle cx="715" cy="440" r="2" fill="#43a047"/><circle cx="712" cy="446" r="2" fill="#1e88e5"/>
  <text x="712" y="460" font-size="7" fill="#cfd8ee" text-anchor="middle">RGB LED</text>
  <rect x="600" y="440" width="16" height="12" rx="2" fill="#d0d0d0" stroke="#888"/>
  <circle cx="608" cy="446" r="3" fill="#333"/>
  <text x="608" y="463" font-size="7" fill="#cfd8ee" text-anchor="middle">BOOT</text>
  <rect x="640" y="440" width="16" height="12" rx="2" fill="#d0d0d0" stroke="#888"/>
  <circle cx="648" cy="446" r="3" fill="#333"/>
  <text x="648" y="463" font-size="7" fill="#cfd8ee" text-anchor="middle">RESET</text>
  <g fill="#b08a4a">
    <rect x="570" y="380" width="8" height="5"/><rect x="584" y="380" width="8" height="5"/>
    <rect x="700" y="380" width="8" height="5"/><rect x="714" y="380" width="8" height="5"/>
    <rect x="600" y="360" width="5" height="8"/><rect x="700" y="360" width="5" height="8"/>
  </g>
  <rect x="600" y="300" width="30" height="20" fill="#111"/>
  <text x="615" y="313" font-size="7" fill="#ccc" text-anchor="middle">LDO</text>
  <!-- USB-C connectors -->
  <text x="595" y="486" font-size="9" fill="#ffffff" text-anchor="middle">USB (native, HID)</text>
  <text x="695" y="486" font-size="9" fill="#ffffff" text-anchor="middle">UART (flash)</text>
  <rect x="577" y="492" width="36" height="22" rx="8" fill="#cfd3d8" stroke="#8d939b" stroke-width="2"/>
  <rect x="583" y="499" width="24" height="8" rx="4" fill="#222"/>
  <rect x="677" y="492" width="36" height="22" rx="8" fill="#cfd3d8" stroke="#8d939b" stroke-width="2"/>
  <rect x="683" y="499" width="24" height="8" rx="4" fill="#222"/>

  <!-- ===== wires ===== -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M302,165 L370,165 C450,165 440,435 532,435" stroke="#d32f2f"/>
    <path d="M302,179 L370,179 C460,179 430,446 532,446" stroke="#111111"/>
    <path d="M302,193 L370,193 C450,193 440,314 532,314" stroke="#1e6fd9"/>
    <path d="M302,207 L370,207 C450,207 440,325 532,325" stroke="#2e9e45"/>
  </g>
  <g font-size="9" fill="#333">
    <text x="318" y="161">5V</text>
    <text x="318" y="175">GND</text>
    <text x="318" y="189">sensor RX</text>
    <text x="318" y="203">sensor TX</text>
  </g>

  <!-- ===== legend ===== -->
  <rect x="40" y="380" width="260" height="110" rx="4" fill="#ffffff" stroke="#bbb"/>
  <text x="52" y="398" font-size="12" font-weight="bold" fill="#222">Legend</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="52" y1="414" x2="82" y2="414" stroke="#d32f2f"/>
    <line x1="52" y1="432" x2="82" y2="432" stroke="#111111"/>
    <line x1="52" y1="450" x2="82" y2="450" stroke="#2e9e45"/>
    <line x1="52" y1="468" x2="82" y2="468" stroke="#1e6fd9"/>
  </g>
  <g font-size="11" fill="#333">
    <text x="92" y="418">LD2410B 5V to ESP32 5V</text>
    <text x="92" y="436">LD2410B GND to ESP32 GND</text>
    <text x="92" y="454">LD2410B TX to ESP32 GPIO18 (RX)</text>
    <text x="92" y="472">LD2410B RX to ESP32 GPIO17 (TX)</text>
  </g>
</svg>
